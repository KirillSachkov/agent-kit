# The chain between "tickets agreed" and "PR waits for the owner".
# A step starts from the stage in `when`, runs one fresh agent session with `run`,
# and moves the task to `then` when `check` exits 0. Exit 3 from a check means a retry cannot help.
executor = "steps"          # who leads the chain under /deliver: "steps" or "conductor"
agent = "claude"            # the client and model of every step; a step may name its own
model = "sonnet"
base = "main"               # a run started on this branch gets a worktree of its own
worktrees = "../{project}-worktrees"
branch = "task/{name}"
# setup = "npm ci"          # run once in a new worktree

[[step]]
name = "implement"
when = "ready"
run = "/implement {task}"
run_spec = "/implement-spec {task}"
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain -- . ':!.scratch')" \
  && python3 -m unittest discover -s tests -q"""
attempts = 2
then = "verify"

[[step]]
name = "verify"
when = "verify"
run = "Verify the behaviour of the task in {task} at the current commit with this project's verify skill. Check every acceptance criterion."
check = """v=$(sed -n 's/^Verdict: //p' .evidence/report.md 2>/dev/null | head -1)
case "$v" in
  PASS|PASS+NOTES) exit 0 ;;
  FAIL|BLOCKED) echo "verification verdict: $v"; exit 3 ;;
  *) echo "no verification report"; exit 1 ;;
esac"""
attempts = 2
then = "delivery"

[[step]]
name = "ship"
when = "delivery"
run = "Ship the committed work on this branch for the task in {task}."
check = """gh pr view --json state -q .state | grep -q OPEN && gh pr checks --required >/dev/null"""
attempts = 2
then = "needs-owner"

# The owner asked for changes on the PR: `run <task> --stage rework`.
[[step]]
name = "rework"
when = "rework"
run = "Address the owner's unresolved feedback on this branch's pull request for the task in {task}: read its reviews and comments, change the code and commit."
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain -- . ':!.scratch')" \
  && python3 -m unittest discover -s tests -q"""
attempts = 2
then = "verify"
