# The tasks between "tickets agreed" and "PR waits for the owner".
# A task starts from the stage in `when`, gets one run with the instruction in `run`,
# and moves the ticket to `then` when `check` exits 0. Exit 3 from a check means a retry cannot help.
agent = "claude"            # the client, model and effort of a task that names none; /run-pipeline may name others at the start
model = "sonnet"
base = "main"               # a ticket started on this branch gets a worktree of its own
worktrees = "../{project}-worktrees"
branch = "deliver/{name}"
# setup = "npm ci"          # run once in a new worktree
checks = "python3 -m unittest discover -s tests -q"   # the project's one command for all its checks; a task's check names it as {checks}

[[task]]
name = "implement"
when = "ready"
run = "/implement {ticket}"
run_spec = "/implement-spec {ticket}"
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain -- . ':!.scratch')" \
  && {checks}"""
attempts = 2
then = "ci"

[[task]]
name = "ci"
when = "ci"
run = "Push the branch for {ticket} and open or reuse its PR against main. Mark verification pending. Resolve change-related CI failures and wait for required checks on the final head. The next task owns verification. Leave the PR open."
check = "sh ci/green-head.sh"
attempts = 2
then = "verify"

[[task]]
name = "verify"
verification = true
precheck = "sh ci/green-head.sh"
when = "verify"
run = "Verify the behaviour of the ticket in {ticket} at the current commit with this project's verify skill. Check every acceptance criterion."
check = """v=$(sed -n 's/^Verdict: //p' "$FACTORY_REPORT" 2>/dev/null | head -1)
c=$(sed -n 's/^Commit: //p' "$FACTORY_REPORT" 2>/dev/null | head -1)
test "$c" = "$(git rev-parse HEAD)" || { echo "no verification report for this commit"; exit 1; }
case "$v" in
  PASS|PASS+NOTES) exit 0 ;;
  FAIL|BLOCKED) echo "verification verdict: $v"; exit 3 ;;
  *) echo "no verification report"; exit 1 ;;
esac"""
attempts = 1
then = "delivery"

[[task]]
name = "deliver"
when = "delivery"
precheck = 'test -s "$FACTORY_VERIFICATION_REPORT" && test "$(git rev-parse HEAD)" = "$FACTORY_VERIFIED_HEAD" && sh ci/green-head.sh'
run = "/deliver {ticket} using the completed CI and verification for this head. Read the accepted report at $FACTORY_VERIFICATION_REPORT, update the existing PR body with evidence, and leave the PR for the owner. If the revision changed, report a blocker."
check = 'test "$(git rev-parse HEAD)" = "$FACTORY_VERIFIED_HEAD" && sh ci/green-head.sh'
attempts = 2
then = "needs-owner"

# The owner asked for changes on the PR: `run <ticket> --stage rework`.
[[task]]
name = "rework"
when = "rework"
run = "Address the owner's unresolved feedback on this branch's pull request for the ticket in {ticket}: read its reviews and comments, change the code and commit. Then call the code-review skill on the changes since the commit you started from, and commit the fixes."
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain -- . ':!.scratch')" \
  && {checks}"""
attempts = 2
then = "ci"
